seed: 42

model:
  coord_dim: 2
  pos_enc_dim: 16
  hidden_channels: 48
  num_layers: 4
  basis_per_layer: 5
  heads: 3
  dropout: 0.08

data:
  pde_type: helmholtz
  problem_config: ../problems/helmholtz.yaml
  mesh_size: 1000
  train_samples: 1000
  test_samples: 64
  randomize_geometry: true
  randomize_params: true
  param_variation: 0.1
  use_preconditioner: false

training:
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.00001
  gradient_clip: 1.0
  save_interval: 50
  max_basis_size: 400
  orthogonalization: incremental
  stages:
    - steps: 1
      epochs: 100
    - steps: 2
      epochs: 100
    - steps: 3
      epochs: 150

solver:
  max_iterations: 50
  max_basis_size: 400
  absolute_tolerance: 0.00001
  min_reduction: 0.05
  min_reduction_patience: 2
  orthogonalization: incremental

evaluation:
  batch_size: 64
  warmup_iterations: 1
  compare_gmres: true
  compare_fgmres: true
  compare_minres: false
  krylov_restart: 40
  krylov_max_iterations: 500
